name: Deploy auf moosburg.eu/stadtrat/

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-stadtrat
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Import Map fuer die CSP aufloesen
        # moosburg.eu erlaubt Skripte nur als Datei (CSP script-src 'self') und
        # blockiert damit die Import Map, die inline in index.html steht. Ohne
        # sie bekaemen die Module keine Versionskennung, und nach einem Deploy
        # kaeme wieder ein alter Stand aus dem Cache (der Fall vom 08.09.2026).
        # Hier traegt deshalb jeder relative Modul-Import die Kennung selbst,
        # und die Map entfaellt. GitHub Pages sendet keine CSP und bekommt
        # index.html unveraendert aus dem Repo.
        run: |
          tag=$(grep -o 'js/app\.js?v=[0-9a-f]*' index.html | head -1 | cut -d= -f2)
          test -n "$tag"
          perl -0pi -e 's#<script type="importmap">.*?</script>\r?\n##s' index.html
          find js -name '*.js' -print0 | xargs -0 perl -pi -e 's#((?:from|import)\s*\(?\s*")(\.\.?/[^"?]+\.js)(")#$1$2?v='"$tag"'$3#g'
          if grep -q importmap index.html; then echo "Import Map noch in index.html"; exit 1; fi
          if grep -rqE '(from|import)\s*\(?\s*"\.\.?/[^"?]+\.js"' js; then echo "Import ohne Kennung"; exit 1; fi

      # Einmalig, 06.11.2026: Ein Push von parliament-v2 hat dessen alten
      # Workflow ausgeloest. Der hat live Dateien ersetzt und geloescht und ist
      # abgebrochen, bevor er seinen Sync-Stand schrieb. Ohne Sync-Stand laedt
      # die Action unten alles neu hoch. Die Dateien, die nur der alte Stand
      # hatte, werden hier geloescht. Das Zertifikat lautet auf *.hstgr.io.
      - name: Sync-Stand und Altlasten loeschen
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          s=stadtrat
          args=(-Q "DELE $s/.ftp-deploy-sync-state.json")
          for f in data/sessionlengths.json data/sitzungenlaenge_2020-2026.json data/termine.json \
                   data/vote_tracking/protokoll-2026-04-13_bpu.zip data/vote_tracking/protokoll-2026-05-18_plenum.zip \
                   data/vote_tracking/protokoll-2026-06-29_plenum.zip data/vote_tracking/protokoll-2026-07-20_plenum.zip \
                   data/vote_tracking/protokoll-2026-07-27_plenum.zip fonts/Inter-latin-var.woff2 \
                   fonts/PlayfairDisplay-latin-400.woff2 fonts/PlayfairDisplay-latin-700.woff2 \
                   img/brushstrokeexample.svg img/exampleplacement.png img/hauptstrasse.svg img/logos/CSU.svg \
                   img/logos/Merkur.de_Logo_10.2022.svg img/topics/legal-wall.jpg; do
            args+=(-Q "*DELE $s/$f")
          done
          for d in data/knowledge data/vote_tracking fonts; do args+=(-Q "*RMD $s/$d"); done
          curl -sS --ssl-reqd --connect-to "ftp.hstgr.io:21:$FTP_HOST:21" -u "$FTP_USER:$FTP_PASSWORD" "${args[@]}" "ftp://ftp.hstgr.io/" -o /dev/null

      - name: Nach stadtrat/ spiegeln
        # Ab v4.3.6 bricht der Lauf nicht mehr ab, wenn das Löschen eines
        # Ordners mit 550 scheitert — die Action adressiert ihn absolut
        # (/stadtrat/…), während der FTP-Login schon dort wurzelt. Seither
        # ist das eine Warnung; der Lauf speichert am Ende seinen Sync-Stand,
        # und der nächste Push fängt nicht wieder von vorn an.
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: stadtrat/

          # Alle Projekte teilen sich ein FTP-Konto. Kurz nach einer anderen
          # Übertragung nimmt Hostinger die Verbindung verzögert an, und die
          # 30 s Standard-Timeout der Action reichen dann nicht.
          timeout: 120000

          # `**/.git*` deckt .github und .gitignore ab, aber nicht .claude:
          # dessen SKILL.md-Dateien fielen zwar unter **/*.md, die leeren
          # Ordner landeten trotzdem auf dem Server. Werkzeug-Interna gehören
          # nicht auf einen öffentlichen Webserver.
          exclude: |
            **/.git*
            **/.git*/**
            .claude
            .claude/**
            **/node_modules/**
            docs/**
            scripts/**
            quellen/**
            **/*.md
