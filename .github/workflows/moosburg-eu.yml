name: Deploy auf moosburg.eu/stadtrat/

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-stadtrat
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Import Map fuer die CSP aufloesen
        # moosburg.eu erlaubt Skripte nur als Datei (CSP script-src 'self') und
        # blockiert damit die Import Map, die inline in index.html steht. Ohne
        # sie bekaemen die Module keine Versionskennung, und nach einem Deploy
        # kaeme wieder ein alter Stand aus dem Cache (der Fall vom 08.09.2026).
        # Hier traegt deshalb jeder relative Modul-Import die Kennung selbst,
        # und die Map entfaellt. GitHub Pages sendet keine CSP und bekommt
        # index.html unveraendert aus dem Repo.
        run: |
          tag=$(grep -o 'js/app\.js?v=[0-9a-f]*' index.html | head -1 | cut -d= -f2)
          test -n "$tag"
          perl -0pi -e 's#<script type="importmap">.*?</script>\r?\n##s' index.html
          find js -name '*.js' -print0 | xargs -0 perl -pi -e 's#((?:from|import)\s*\(?\s*")(\.\.?/[^"?]+\.js)(")#$1$2?v='"$tag"'$3#g'
          if grep -q importmap index.html; then echo "Import Map noch in index.html"; exit 1; fi
          if grep -rqE '(from|import)\s*\(?\s*"\.\.?/[^"?]+\.js"' js; then echo "Import ohne Kennung"; exit 1; fi

      # Eigenes FTP-Konto, in hPanel auf den Ordner stadtrat beschränkt: Das
      # Login beginnt dort, deshalb unten server-dir ./. Gehören die Secrets zu
      # einem anderen Konto oder liegt das Login in der Domain-Wurzel, bricht
      # der Deploy hier ab, bevor etwas übertragen wird (moosburg-eu/BRIEFING.md).
      - name: Ziel prüfen
        env:
          KONTO: stadtrat
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -o pipefail
          case "$FTP_USER" in
            *"$KONTO") ;;
            *) echo "FTP_USER ist nicht das Konto $KONTO. Abbruch."; exit 1 ;;
          esac
          liste=$(curl -sS --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" --list-only "ftp://$FTP_HOST/" | tr -d '\r')
          if grep -qx stadtrat <<< "$liste" && grep -qx abstimmung <<< "$liste"; then
            echo "Das Login liegt in der Domain-Wurzel. Abbruch."; exit 1
          fi

      - name: Nach stadtrat/ spiegeln
        # Ab v4.3.6 bricht der Lauf nicht mehr ab, wenn das Löschen eines
        # Ordners mit 550 scheitert — die Action adressiert ihn absolut
        # (/stadtrat/…), während der FTP-Login schon dort wurzelt. Seither
        # ist das eine Warnung; der Lauf speichert am Ende seinen Sync-Stand,
        # und der nächste Push fängt nicht wieder von vorn an.
        # v4.4.0, auf den Commit gepinnt: Ein verschobener Tag soll nicht
        # unbemerkt anderen Code an das FTP-Passwort bringen.
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Prüft das Zertifikat. FTP_HOST ist deshalb srv1973.hstgr.io: Das
          # Zertifikat lautet auf *.hstgr.io, ftp.moosburg.eu passt nicht dazu.
          security: strict
          local-dir: ./
          server-dir: ./

          # Kurz nach einer anderen Übertragung nimmt Hostinger die Verbindung
          # verzögert an; die 30 s Standard-Timeout reichen dann nicht.
          timeout: 120000

          # `**/.git*` deckt .github und .gitignore ab, aber nicht .claude:
          # dessen SKILL.md-Dateien fielen zwar unter **/*.md, die leeren
          # Ordner landeten trotzdem auf dem Server. Werkzeug-Interna gehören
          # nicht auf einen öffentlichen Webserver.
          exclude: |
            **/.git*
            **/.git*/**
            .claude
            .claude/**
            **/node_modules/**
            docs/**
            scripts/**
            quellen/**
            **/*.md
