name: Einmalig - vote_tracking vom Server entfernen

# Der Deploy scheitert beim Loeschen von Ordnern (550, absoluter Pfad). Dieser
# Lauf loescht die Dateien relativ zum FTP-Login und setzt den Sync-Stand
# zurueck; der naechste Deploy laedt dann alles neu hoch. Danach wird die
# Datei wieder entfernt.

on:
  workflow_dispatch:

jobs:
  aufraeumen:
    runs-on: ubuntu-latest
    steps:
      - name: Vorher auflisten
        run: curl -sS -k --ssl-reqd --list-only -u "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_HOST }}/stadtrat/data/vote_tracking/"
      - name: Dateien, Ordner und Sync-Stand loeschen
        run: |
          curl -sS -k --ssl-reqd -u "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_HOST }}/" -o /dev/null \
            -Q "DELE stadtrat/data/vote_tracking/protokoll-2026-04-13_bpu.zip" \
            -Q "DELE stadtrat/data/vote_tracking/protokoll-2026-05-18_plenum.zip" \
            -Q "DELE stadtrat/data/vote_tracking/protokoll-2026-06-29_plenum.zip" \
            -Q "DELE stadtrat/data/vote_tracking/protokoll-2026-07-20_plenum.zip" \
            -Q "DELE stadtrat/data/vote_tracking/protokoll-2026-07-27_plenum.zip" \
            -Q "RMD stadtrat/data/vote_tracking" \
            -Q "DELE stadtrat/.ftp-deploy-sync-state.json"
      - name: Nachher auflisten
        run: curl -sS -k --ssl-reqd --list-only -u "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_HOST }}/stadtrat/data/"
